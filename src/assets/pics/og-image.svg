<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="78%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#151513"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </radialGradient>
    <linearGradient id="heroFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A44C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C9A44C" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- eyebrow -->
  <text x="80" y="188" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="21" letter-spacing="3" fill="#C9A44C">&lt;web-developer&gt;</text>

  <!-- name -->
  <text x="78" y="270" font-family="'SF Mono','Menlo','Consolas',monospace" font-weight="700" font-size="66" fill="#F5F1E8">Stephan</text>
  <text x="78" y="342" font-family="'SF Mono','Menlo','Consolas',monospace" font-weight="700" font-size="66" fill="#F5F1E8">Benchemoul</text>

  <!-- cursor block after name -->
  <rect x="565" y="298" width="20" height="46" fill="#C9A44C"/>

  <!-- tagline -->
  <text x="80" y="404" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="26" fill="#A9A49B">Websites &amp; Online Stores — Built to Order</text>

  <!-- closing tag bottom -->
  <text x="80" y="470" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="21" letter-spacing="3" fill="#4A473F">&lt;/web-developer&gt;</text>

  <!-- browser window mockup, signature element -->
  <g transform="translate(700, 120)">
    <rect x="0" y="0" width="430" height="380" rx="10" fill="#131211" stroke="#2A2822" stroke-width="1.5"/>
    <!-- top bar -->
    <rect x="0" y="0" width="430" height="38" rx="10" fill="#181715"/>
    <rect x="0" y="28" width="430" height="10" fill="#181715"/>
    <circle cx="22" cy="19" r="5" fill="#3A372F"/>
    <circle cx="42" cy="19" r="5" fill="#3A372F"/>
    <circle cx="62" cy="19" r="5" fill="#3A372F"/>
    <rect x="150" y="12" width="150" height="14" rx="7" fill="#232019"/>

    <!-- nav row, echoes his site's anchor-link menu -->
    <line x1="30" y1="70" x2="70" y2="70" stroke="#C9A44C" stroke-width="2"/>
    <line x1="320" y1="70" x2="360" y2="70" stroke="#4A473F" stroke-width="2"/>
    <line x1="368" y1="70" x2="400" y2="70" stroke="#4A473F" stroke-width="2"/>

    <!-- hero block -->
    <rect x="30" y="100" width="370" height="140" rx="4" fill="url(#heroFill)" stroke="#2A2822" stroke-width="1"/>
    <line x1="50" y1="140" x2="220" y2="140" stroke="#F5F1E8" stroke-width="3" stroke-opacity="0.55"/>
    <line x1="50" y1="160" x2="170" y2="160" stroke="#8A8680" stroke-width="2" stroke-opacity="0.5"/>
    <rect x="50" y="190" width="90" height="26" rx="4" fill="#C9A44C" fill-opacity="0.85"/>

    <!-- two content blocks -->
    <rect x="30" y="256" width="175" height="100" rx="4" fill="#181715" stroke="#2A2822" stroke-width="1"/>
    <rect x="225" y="256" width="175" height="100" rx="4" fill="#181715" stroke="#2A2822" stroke-width="1"/>
    <line x1="48" y1="280" x2="150" y2="280" stroke="#6E6A62" stroke-width="2"/>
    <line x1="48" y1="296" x2="120" y2="296" stroke="#4A473F" stroke-width="2"/>
    <line x1="243" y1="280" x2="345" y2="280" stroke="#6E6A62" stroke-width="2"/>
    <line x1="243" y1="296" x2="315" y2="296" stroke="#4A473F" stroke-width="2"/>
  </g>
</svg>
